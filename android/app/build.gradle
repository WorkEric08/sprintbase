apply plugin: 'com.android.application'

// Versão do app = a do package.json (única fonte). 0.3.0 → versionName "0.3.0", versionCode 300
// (maior.menor.patch → maior*10000 + menor*100 + patch; só pode crescer a cada release).
def sprintPkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def sprintVersionParts = sprintPkg.version.split('-')[0].tokenize('.').collect { it.toInteger() }
def sprintVersionCode = sprintVersionParts[0] * 10000 + sprintVersionParts[1] * 100 + sprintVersionParts[2]

// Assinatura do APK de release. O keystore e as senhas ficam FORA do repositório, em ~/.sprint-signing
// (ou em android/keystore.properties, também ignorado pelo git). Sem eles o release não é assinado.
def sprintSigningFile = [
    file("${System.getProperty('user.home')}/.sprint-signing/keystore.properties"),
    rootProject.file('keystore.properties'),
].find { it.exists() }
def sprintSigning = new Properties()
if (sprintSigningFile) sprintSigningFile.withInputStream { sprintSigning.load(it) }

android {
    namespace = "com.workeric08.sprint"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.workeric08.sprint"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode sprintVersionCode
        versionName sprintPkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (sprintSigningFile) {
                storeFile file(sprintSigning['storeFile'])
                storePassword sprintSigning['storePassword']
                keyAlias sprintSigning['keyAlias']
                keyPassword sprintSigning['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Debug e release têm assinaturas diferentes; com ids diferentes os dois convivem no aparelho
            // (cada um com seus próprios dados) em vez de um exigir desinstalar o outro.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (sprintSigningFile) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
