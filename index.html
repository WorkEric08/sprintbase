<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sprint</title>
  <meta name="theme-color" content="#f9fafb" />
  <script>
    // Evita flash de cor errada: aplica o tema salvo antes do React montar.
    // 'sprint_theme' é um espelho do tema guardado no IndexedDB (ver AppDataContext).
    (function () {
      try {
        var theme = localStorage.getItem('sprint_theme');
        var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#030712' : '#f9fafb');
      } catch (e) { }
    })();
  </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
